name: mailinlin-voice-demo

services:
  postgres:
    # The ECS Docker Hub mirror does not cache pgvector. Use the DaoCloud
    # proxy and pin the downloaded official pgvector 0.8.6 / PostgreSQL 17
    # manifest so deployments remain reproducible.
    image: docker.m.daocloud.io/pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [internal]

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [internal]

  minio:
    # Reuse the fixed MinIO image already serving other isolated workloads on
    # this ECS. It is namespaced by Compose volumes and shares no application
    # data with those services.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_API_CORS_ALLOW_ORIGIN: "https://${VOICE_DEMO_HOST}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [internal]

  coturn:
    image: docker.m.daocloud.io/coturn/coturn:4.8.0
    restart: unless-stopped
    command:
      - -n
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--external-ip=${SERVER_IP:?SERVER_IP is required}"
      - "--realm=${VOICE_DEMO_HOST:?VOICE_DEMO_HOST is required}"
      - --use-auth-secret
      - "--static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}"
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - "--log-file=stdout"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    logging: *logging
    networks: [internal]

  api:
    image: mailinlin/voice-demo-api:local
    build:
      context: ../..
      dockerfile: deploy/voice-demo/Dockerfile.api-overlay
      args:
        DOGRAH_API_BASE: ${DOGRAH_API_IMAGE:-ghcr.io/dograh-hq/dograh-api:1.45.0}
    # The verified base image is preloaded on the ECS because direct GHCR
    # downloads are unreliable from this region. Source-code overrides below
    # continue to be deployed from GitHub.
    pull_policy: never
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ENABLE_SIGNUP: "false"
      PUBLIC_BASE_URL: "https://${VOICE_DEMO_HOST}"
      PUBLIC_HOST: "${VOICE_DEMO_HOST}"
      BACKEND_API_ENDPOINT: "https://${VOICE_DEMO_HOST}"
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: "https://${VOICE_DEMO_HOST}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: voice-audio
      MINIO_SECURE: "false"
      FASTAPI_WORKERS: "1"
      ARQ_WORKERS: "1"
      ENABLE_ARI_MANAGER: "false"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "false"
      FORWARDED_ALLOW_IPS: "*"
      ENABLE_COTURN: "true"
      TURN_HOST: "${SERVER_IP}"
      TURN_PORT: "${TURN_PORT:-3478}"
      # This deployment does not expose a TLS listener on 5349. Advertising it
      # makes browsers wait on a TURN endpoint that can never answer.
      TURN_TLS_PORT: "${TURN_TLS_PORT:-0}"
      TURN_SECRET: "${TURN_SECRET}"
      FORCE_TURN_RELAY: "${FORCE_TURN_RELAY:-false}"
      SERVER_IP: "${SERVER_IP}"
      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?OSS_JWT_SECRET is required}"
      ENABLE_TELEMETRY: "false"
    volumes:
      - ../../api/services/configuration/options/azure.py:/app/api/services/configuration/options/azure.py:ro
      - ../../api/services/configuration/options/dashscope.py:/app/api/services/configuration/options/dashscope.py:ro
      - ../../api/services/configuration/options/ministream.py:/app/api/services/configuration/options/ministream.py:ro
      - ../../api/services/configuration/options/__init__.py:/app/api/services/configuration/options/__init__.py:ro
      - ../../api/services/configuration/registry.py:/app/api/services/configuration/registry.py:ro
      - ../../api/services/configuration/check_validity.py:/app/api/services/configuration/check_validity.py:ro
      - ../../api/services/configuration/ai_model_configuration.py:/app/api/services/configuration/ai_model_configuration.py:ro
      - ../../api/db/organization_configuration_client.py:/app/api/db/organization_configuration_client.py:ro
      - ../../api/db/workflow_run_client.py:/app/api/db/workflow_run_client.py:ro
      - ../../api/alembic/versions:/app/api/alembic/versions:ro
      - ../../api/routes/public_embed.py:/app/api/routes/public_embed.py:ro
      - ../../api/utils/url_security.py:/app/api/utils/url_security.py:ro
      - ../../api/services/dashscope:/app/api/services/dashscope:ro
      - ../../api/services/ministream:/app/api/services/ministream:ro
      - ../../api/services/metaphysics:/app/api/services/metaphysics:ro
      - ../../api/services/gen_ai/embedding/dashscope_service.py:/app/api/services/gen_ai/embedding/dashscope_service.py:ro
      - ../../api/services/gen_ai/embedding/factory.py:/app/api/services/gen_ai/embedding/factory.py:ro
      - ../../api/tasks/knowledge_base_processing.py:/app/api/tasks/knowledge_base_processing.py:ro
      - ../../api/services/pipecat/service_factory.py:/app/api/services/pipecat/service_factory.py:ro
      - ../../api/services/pipecat/direct_faq_retrieval.py:/app/api/services/pipecat/direct_faq_retrieval.py:ro
      - ../../api/services/pipecat/direct_final_transcript_processor.py:/app/api/services/pipecat/direct_final_transcript_processor.py:ro
      - ../../api/services/pipecat/voice_turn_boundary_registry.py:/app/api/services/pipecat/voice_turn_boundary_registry.py:ro
      - ../../api/services/pipecat/consultation_response_guard_processor.py:/app/api/services/pipecat/consultation_response_guard_processor.py:ro
      - ../../api/services/pipecat/pipeline_builder.py:/app/api/services/pipecat/pipeline_builder.py:ro
      - ../../api/services/pipecat/run_pipeline.py:/app/api/services/pipecat/run_pipeline.py:ro
      - ../../api/services/workflow/memory.py:/app/api/services/workflow/memory.py:ro
      - ../../api/services/workflow/initial_context.py:/app/api/services/workflow/initial_context.py:ro
      - ../../api/services/workflow/pipecat_engine.py:/app/api/services/workflow/pipecat_engine.py:ro
      - ../../api/services/workflow/text_chat_runner.py:/app/api/services/workflow/text_chat_runner.py:ro
      - ../../scripts/optimize_yishui_agent.py:/app/scripts/optimize_yishui_agent.py:ro
      - ../../knowledge-base/麦玲玲AI_Agent_FAQ库_粤语_RAG.txt:/app/knowledge-base/麦玲玲AI_Agent_FAQ库_粤语_RAG.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s
    logging: *logging
    networks: [internal]

  ui:
    image: mailinlin/voice-demo-ui:local
    build:
      context: ../..
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://api:8000
      NODE_ENV: oss
      ENABLE_TELEMETRY: "false"
      YISHUI_VOICE_DEMO_TOKEN: "${YISHUI_VOICE_DEMO_TOKEN:?YISHUI_VOICE_DEMO_TOKEN is required}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3010/voice-demo || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s
    logging: *logging
    networks: [internal]

  gateway:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VOICE_DEMO_LOCAL_PORT:-18080}:80"
    volumes:
      - ./nginx.voice-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]

  edge:
    image: docker.m.daocloud.io/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      VOICE_DEMO_HOST: "${VOICE_DEMO_HOST:?VOICE_DEMO_HOST is required}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
